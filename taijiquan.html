---
layout: default
title: Taijiquan
---
<main class="about-page taijiquan-page">
  {% for item in site.data.taijiquan %}
    <section class="sections taiji-section">
      <div>
        <p class="eyebrow">{{ item.title }}</p>
        {% assign paragraphs = item.content | split: '<br><br>' %}
        {% for paragraph in paragraphs %}
          <p>{{ paragraph }}</p>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</main>
