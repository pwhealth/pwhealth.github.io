---
layout: default
title: Chinese Herbology
---

<main class="about-page chineseherbal-page">
  {% for item in site.data.chineseherbal %}
    <section class="sections herbal-section">
      <div>
        <p class="eyebrow">{{ item.title }}</p>
        {% assign paragraphs = item.content | split: '<br><br>' %}
        {% for paragraph in paragraphs %}
          <p>{{ paragraph }}</p>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</main>
